<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

    <header class="main-header">
        <nav>
            <a href="index.html">Home</a>
            <a href="schedule.html">Class Schedule</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <div class="dashboard-wrapper">
  <aside class="sidebar">
            
            <div class="profile-section">
                <img src="girl_emoji.png" alt="Profile Picture" class="profile-pic">
                <h2>Raneem</h2>
                <p>IT Student</p>
            </div>

            <div class="sidebar-contact">
                <h3>Contact Info</h3>
                <hr class="contact-divider">
                <p class="contact-info">
                    Email: <a href="mailto:ittraneem66@gmail.com">ittraneem66@gmail.com</a>
                </p>
                <p class="contact-info">
                    Phone: <a href="tel:+966500000000">+966 50 000 0000</a>
                </p>
                
                <div class="social-icons">
                    <a href="https://x.com/1iran09" target="_blank" class="icon-link">
                        <img src="https://img.freepik.com/free-vector/new-twitter-logo-x-2023-twitter-x-logo-vector-download_691560-10809.jpg" alt="X Icon" style="width: 32px; border-radius: 4px; mix-blend-mode: multiply;">
                    </a>
                    <a href="https://www.linkedin.com/in/raneemalshamrani/" target="_blank" class="icon-link">
                        <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn Icon" style="width: 30px; border-radius: 4px;">
                    </a>
                </div>
            </div>

        </aside>
        <main class="main-content">
            <section class="card">
                <h2>Get in Touch</h2>
                <form action="https://webhook.site/YOUR-UNIQUE-ID" method="POST" class="contact-form">
                    
                    <div class="form-group">
                        <label for="name">Name <span class="required">*</span></label>
                        <input type="text" id="name" name="name" required placeholder="Enter your full name"> </div>

                    <div class="form-group">
                        <label for="email">Email (Optional)</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address"> </div>

                    <div class="form-group radio-group">
                        <label>Message Type:</label>
                        <div class="radio-options">
                            <label><input type="radio" name="messageType" value="inquiry" checked> Inquiry</label> <label><input type="radio" name="messageType" value="complaint"> Complaint</label> </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message <span class="required">*</span></label>
                        <textarea id="message" name="message" rows="10" required placeholder="Write your message here..."></textarea> </div>

                    <button type="submit" class="submit-btn">Send Message</button> </form>
            </section>
        </main>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 My Portfolio. All rights reserved.</p>
    </footer>

</body>
